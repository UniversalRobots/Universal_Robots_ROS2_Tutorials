name: Lyrical Binary Testing
on:
  workflow_dispatch:
    branches:
      - main
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '34 12 * * 0'

jobs:
  lyrical_binary_testing:
    uses: ./.github/workflows/reusable_ici.yml
    with:
      ros_distro: lyrical
      ros_repo: testing
      ref_for_scheduled_build: main
